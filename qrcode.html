<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de QR Code (Offline)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f0f2f5; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .container {
    background: #fff; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.1);
    padding: 32px; width: 100%; max-width: 420px; text-align: center;
  }
  h1 { font-size: 1.4rem; color: #1a1a1a; margin-bottom: 20px; }
  textarea {
    width: 100%; padding: 12px 14px; font-size: 1rem;
    border: 1px solid #d1d5db; border-radius: 8px;
    outline: none; font-family: inherit; min-height: 80px;
    resize: vertical;
  }
  textarea:focus { border-color: #3b82f6; }
  button {
    width: 100%; padding: 12px; margin-top: 12px;
    font-size: 1rem; font-weight: 600; color: #fff;
    background: #3b82f6; border: none; border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #2563eb; }
  button.secondary { background: #10b981; }
  button.secondary:hover { background: #059669; }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  #qrcode { margin: 22px auto 0; display: flex; justify-content: center; }
  #qrcode canvas { max-width: 100%; height: auto; border-radius: 8px; image-rendering: pixelated; }
  .msg { color: #ef4444; font-size: .875rem; margin-top: 12px; min-height: 20px; }
</style>
</head>
<body>
  <div class="container">
    <h1>Gerador de QR Code</h1>
    <textarea id="textInput" placeholder="Digite o texto, URL ou qualquer conteúdo..."></textarea>
    <button id="generateBtn">Gerar QR Code</button>
    <button id="downloadBtn" class="secondary" disabled>Baixar PNG</button>
    <div id="qrcode"></div>
    <div class="msg" id="msg"></div>
  </div>

    var rsBlock = RS_BLOCK_TABLE[(typeNumber - 1) * 4 + ecc];
    if (!rsBlock) throw new Error("RS block inexistente para versão " + typeNumber + ", ecc " + ecc);
    var list = [];
    for (var i = 0; i < rsBlock.length; ) {
      var count = rsBlock[i++], total = rsBlock[i++], data = rsBlock[i++];
      for (var j = 0; j < count; j++) list.push({ totalCount: total, dataCount: data });
    }
    return list;
  }

  function getBCHDigit(d) { var n = 0; while (d !== 0) { n++; d >>>= 1; } return n; }
  function getBCHTypeInfo(data) {

    while (getBCHDigit(d) - getBCHDigit(0x537) >= 0) d ^= (0x537 << (getBCHDigit(d) - getBCHDigit(0x537)));
    return ((data << 10) | d) ^ 0x5412;
  }
  function getBCHTypeNumber(data) {
    var d = data << 12;
    while (getBCHDigit(d) - getBCHDigit(0x1F25) >= 0) d ^= (0x1F25 << (getBCHDigit(d) - getBCHDigit(0x1F25)));
    return (data << 12) | d;

      } else {
        i++;
        var c2 = str.charCodeAt(i);
        var cp = 0x10000 + (((c & 0x3FF) << 10) | (c2 & 0x3FF));
        bytes.push(0xF0 | (cp >> 18)); bytes.push(0x80 | ((cp >> 12) & 0x3F));
        bytes.push(0x80 | ((cp >> 6) & 0x3F)); bytes.push(0x80 | (cp & 0x3F));
      }
    }
    return bytes;
  }

  // escolhe menor versão que caiba (ECC M)
  function chooseType(bytes, ecc) {
    for (var type = 1; type <= 40; type++) {
      var rsBlocks = getRSBlocks(type, ecc);
      var totalData = 0;
      for (var i = 0; i < rsBlocks.length; i++) totalData += rsBlocks[i].dataCount;
      var lengthBits = (type <= 9) ? 8 : 16;
      var capacityBits = totalData * 8 - 4 - lengthBits;
      if (bytes.length * 8 <= capacityBits) return type;
    }
    throw new Error("Texto muito longo para o QR Code.");
  }

  // ---------- API pública ----------
  function generateQRCode(text, size) {
    var bytes = stringToBytes(text);
    var ecc = 1; // M
    var type = chooseType(bytes, ecc);
    var data = createData(type, ecc, bytes);
    var qr = new QRCodeModel(type, ecc, data);
    qr.make();

    var count = qr.moduleCount;
    size = size || 256;
    var scale = Math.max(1, Math.floor(size / (count + 4)));
    var margin = 2 * scale;
    var canvas = document.createElement("canvas");
    canvas.width = canvas.height = count * scale + margin * 2;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000000";
    for (var r = 0; r < count; r++) {
      for (var c = 0; c < count; c++) {
        if (qr.modules[r][c]) {
          ctx.fillRect(margin + c * scale, margin + r * scale, scale, scale);
        }
      }
    }
    return canvas;
  }

  global.generateQRCode = generateQRCode;
})(window);

/* ============================================================
   UI
   ============================================================ */
const input = document.getElementById('textInput');
const btn = document.getElementById('generateBtn');
const downloadBtn = document.getElementById('downloadBtn');
const qrContainer = document.getElementById('qrcode');
const msg = document.getElementById('msg');
let currentCanvas = null;

function generateQR() {
  const text = input.value.trim();
  msg.textContent = '';
  if (!text) {
    msg.textContent = 'Por favor, digite algum texto.';
    return;
  }
  try {
    qrContainer.innerHTML = '';
    currentCanvas = window.generateQRCode(text, 256);
    qrContainer.appendChild(currentCanvas);
    downloadBtn.disabled = false;
  } catch (err) {
    msg.textContent = 'Erro: ' + (err && err.message ? err.message : err);
    downloadBtn.disabled = true;
  }
}

btn.addEventListener('click', generateQR);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); generateQR(); }
});
downloadBtn.addEventListener('click', () => {
  if (!currentCanvas) return;
  const link = document.createElement('a');
  link.download = 'qrcode.png';
  link.href = currentCanvas.toDataURL('image/png');
  link.click();
});
</script>
